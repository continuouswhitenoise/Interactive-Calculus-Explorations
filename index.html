<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Line Integral Simulator</title>
    <script src="https://cloudflare.com" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        body { font-family: 'DejaVu Sans', Arial, sans-serif; background-color: #121212; color: #E0E0E0; margin: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 1000px; width: 100%; background-color: #1E1E1E; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; }
        label { color: #A0A0A0; font-size: 0.9rem; margin-bottom: 5px; }
        input { background-color: #2D2D2D; border: 1px solid #707070; color: #E0E0E0; padding: 8px; border-radius: 4px; font-size: 1rem; }
        button { background-color: #007acc; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 15px; }
        button:hover { background-color: #005999; }
        .results-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background-color: #252526; padding: 15px; border-radius: 6px; margin: 20px 0; border-left: 4px solid #007acc; }
        .result-card h3 { margin: 0 0 5px 0; font-size: 0.85rem; color: #A0A0A0; text-transform: uppercase; }
        .result-card p { margin: 0; font-size: 1.6rem; font-weight: bold; color: #FFF; }
        .canvas-container { position: relative; width: 100%; height: 500px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Interactive Line Integral Canvas</h2>
    <p style="color: #A0A0A0; margin-top: -10px; margin-bottom: 25px;">Type expressions using standard math names like <code>cos(t)</code>, <code>sin(t)</code>, <code>pi</code>, <code>x^2</code>.</p>
    <div class="controls">
        <div class="input-group"><label>Vector Field F_x(x, y)</label><input type="text" id="fx" value="-y"></div>
        <div class="input-group"><label>Vector Field F_y(x, y)</label><input type="text" id="fy" value="x"></div>
        <div class="input-group"><label>Curve x(t)</label><input type="text" id="rx" value="cos(t)"></div>
        <div class="input-group"><label>Curve y(t)</label><input type="text" id="ry" value="2 * sin(t)"></div>
        <div class="input-group"><label>t start (a)</label><input type="text" id="ta" value="0"></div>
        <div class="input-group"><label>t end (b)</label><input type="text" id="tb" value="2 * pi"></div>
    </div>
    <button onclick="updateSimulation()">Calculate & Render Plot</button>
    <div class="results-panel">
        <div class="result-card"><h3>Work Integral (∫ F · dr)</h3><p id="work-val">0.0000</p></div>
        <div class="result-card"><h3>Flux Integral (∫ F · n ds)</h3><p id="flux-val">0.0000</p></div>
    </div>
    <div class="canvas-container"><canvas id="simChart"></canvas></div>
</div>
<script>
    let chartInstance = null;
    function parseToNativeFunction(formulaStr, variables) {
        let clean = formulaStr.replace(/Math\./g, '');
        clean = clean.replace(/sin\(/g, 'Math.sin(').replace(/cos\(/g, 'Math.cos(').replace(/tan\(/g, 'Math.tan(').replace(/exp\(/g, 'Math.exp(').replace(/log\(/g, 'Math.log(').replace(/sqrt\(/g, 'Math.sqrt(').replace(/pi/gi, 'Math.PI');
        clean = clean.replace(/([a-zA-Z0-9_]+)\s*\^\s*([a-zA-Z0-9_]+)/g, 'Math.pow($1, $2)');
        return new Function(...variables, "return " + clean + ";");
    }
    function safeEvalBounds(valStr) {
        let clean = valStr.replace(/Math\./g, '').replace(/pi/gi, 'Math.PI').replace(/sin\(/g, 'Math.sin(').replace(/cos\(/g, 'Math.cos(');
        return new Function("return " + clean + ";")();
    }
    function updateSimulation() {
        try {
            const fxFunc = parseToNativeFunction(document.getElementById('fx').value, ['x', 'y']);
            const fyFunc = parseToNativeFunction(document.getElementById('fy').value, ['x', 'y']);
            const rxFunc = parseToNativeFunction(document.getElementById('rx').value, ['t']);
            const ryFunc = parseToNativeFunction(document.getElementById('ry').value, ['t']);
            const a = safeEvalBounds(document.getElementById('ta').value);
            const b = safeEvalBounds(document.getElementById('tb').value);
            const mathSteps = 150; const mathCurvePoints = [];
            for (let i = 0; i <= mathSteps; i++) {
                const t = a + (i / mathSteps) * (b - a);
                mathCurvePoints.push({ x: rxFunc(t), y: ryFunc(t) });
            }
            let totalWork = 0; let totalFlux = 0; const vectorPoints = [];
            for (let i = 0; i < mathSteps; i++) {
                const pCurrent = mathCurvePoints[i]; const pNext = mathCurvePoints[i + 1];
                const dx = pNext.x - pCurrent.x; const dy = pNext.y - pCurrent.y;
                const midX = (pCurrent.x + pNext.x) / 2; const midY = (pCurrent.y + pNext.y) / 2;
                const Fx = fxFunc(midX, midY); const Fy = fyFunc(midX, midY);
                totalWork += (Fx * dx) + (Fy * dy); totalFlux += (Fx * dy) - (Fy * dx);
                if (i % 10 === 0) {
                    const mag = Math.hypot(Fx, Fy) || 1;
                    vectorPoints.push({ x: midX, y: midY, vx: (Fx / mag) * 0.3, vy: (Fy / mag) * 0.3 });
                }
            }
            document.getElementById('work-val').textContent = totalWork.toFixed(4);
            document.getElementById('flux-val').textContent = totalFlux.toFixed(4);
            renderChart(mathCurvePoints, vectorPoints);
        } catch (error) { alert("Syntax Error: " + error.message); }
    }
    function renderChart(curveData, vectorData) {
        const ctx = document.getElementById('simChart').getContext('2d');
        if (chartInstance) { chartInstance.destroy(); }
        const vectorArrowsPlugin = {
            id: 'vectorArrows',
            afterDatasetsDraw(chart) {
                const {ctx, scales: {x, y}} = chart; ctx.save(); ctx.strokeStyle = 'rgba(0, 122, 204, 0.6)'; ctx.lineWidth = 1.5;
                vectorData.forEach(pt => {
                    const sX = x.getPixelForValue(pt.x); const sY = y.getPixelForValue(pt.y);
                    const eX = x.getPixelForValue(pt.x + pt.vx); const eY = y.getPixelForValue(pt.y + pt.vy);
                    ctx.beginPath(); ctx.moveTo(sX, sY); ctx.lineTo(eX, eY); ctx.stroke();
                    const angle = Math.atan2(eY - sY, eX - sX);
                    ctx.beginPath(); ctx.moveTo(eX, eY);
                    ctx.lineTo(eX - 6 * Math.cos(angle - Math.PI / 6), eY - 6 * Math.sin(angle - Math.PI / 6));
                    ctx.lineTo(eX - 6 * Math.cos(angle + Math.PI / 6), eY - 6 * Math.sin(angle + Math.PI / 6));
                    ctx.fillStyle = 'rgba(0, 122, 204, 0.75)'; ctx.fill();
                });
                ctx.restore();
            }
        };
        chartInstance = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: [{ label: 'Curve Path r(t)', data: curveData, showLine: true, borderColor: '#E0E0E0', borderWidth: 2.5, pointRadius: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { grid: { color: '#2D2D2D' }, ticks: { color: '#707070' } }, y: { grid: { color: '#2D2D2D' }, ticks: { color: '#707070' } } }, plugins: { legend: { labels: { color: '#E0E0E0' } } } },
            plugins: [vectorArrowsPlugin]
        });
    }
    window.onload = updateSimulation;
</script>
</body>
</html>

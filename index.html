<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Integrals of Vector Fields</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #E0E0E0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #header {
            width: 100%;
            padding: 15px 0;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #2D2D2D;
            background-color: #121212;
            z-index: 10;
        }
        #container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: calc(100vh - 60px);
            max-width: 1200px;
            padding: 10px;
            box-sizing: border-box;
        }
        #top-panel {
            flex: 1.1;
            position: relative;
            background-color: #1E1E1E;
            border: 1px solid #333333;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        #bottom-panels {
            flex: 0.9;
            display: flex;
            gap: 15px;
        }
        .plot-panel {
            flex: 1;
            position: relative;
            background-color: #121212;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        #math-box {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(18, 18, 18, 0.85);
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
            pointer-events: none;
            max-width: 320px;
            font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace;
        }
        .box-title {
            font-weight: bold;
            color: #FFFFFF;
            margin-bottom: 4px;
            display: block;
        }
        .box-section {
            margin-bottom: 8px;
        }
        .box-section:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div id="header" id="title-string">Line Integrals of Vector Fields  |  Mode: Manual Drag  |  [Space] Play/Pause</div>
    
    <div id="container">
        <div id="top-panel">
            <canvas id="mapCanvas"></canvas>
            <div id="math-box">
                <div class="box-section">
                    <span class="box-title">Vector Field:</span>
                    F(x,y) = &lang;-y, x&rang; = &lang;<span id="val-u">+0.00</span>, <span id="val-v">+0.00</span>&rang;
                </div>
                <div class="box-section">
                    <span class="box-title">Parametric Curve:</span>
                    r(t) = &lang;cos(t), 2sin(t)&rang; = &lang;<span id="val-x">1.00</span>, <span id="val-y">0.00</span>&rang; at t = <span id="val-t">0.00</span>
                </div>
                <div class="box-section">
                    <span class="box-title">Arc Length Parameterization:</span>
                    R(s) = &lang;<span id="val-rx">1.00</span>, <span id="val-ry">0.00</span>&rang; at distance s = <span id="val-s">0.00</span>
                </div>
            </div>
        </div>
        <div id="bottom-panels">
            <div class="plot-panel">
                <canvas id="workCanvas"></canvas>
            </div>
            <div class="plot-panel">
                <canvas id="fluxCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- MATH INITIALIZATION ---
        const STEPS = 1200;
        const t_values = [];
        const x_all = [];
        const y_all = [];
        const Tx_all = [];
        const Ty_all = [];
        const Nx_all = [];
        const Ny_all = [];
        const f_work_all = [];
        const f_flux_all = [];
        const arc_lengths = [0];

        // 1. Generate Parametric Ellipse Geometry Coordinates
        for(let i = 0; i < STEPS; i++) {
            let t = (i / (STEPS - 1)) * 2 * Math.PI;
            t_values.push(t);
            x_all.push(Math.cos(t));
            y_all.push(2 * Math.sin(t));
        }

        // 2. Pre-calculate Differential Vectors and Tangent/Normal Arrays
        let total_s = 0;
        for(let i = 0; i < STEPS; i++) {
            let next_idx = (i === STEPS - 1) ? i : i + 1;
            let prev_idx = (i === 0) ? i : i - 1;
            
            let dx = x_all[next_idx] - x_all[i];
            let dy = y_all[next_idx] - y_all[i];
            if (i === STEPS - 1) {
                dx = x_all[i] - x_all[prev_idx];
                dy = y_all[i] - y_all[prev_idx];
            }
            
            let ds = Math.hypot(dx, dy);
            if(i > 0) {
                total_s += ds;
                arc_lengths.push(total_s);
            }

            // Standard Vector Field Operations: F(x,y) = <-y, x>
            let u = -y_all[i];
            let v = x_all[i];

            // Normalize Tangent Components
            let tx = dx / (ds || 1);
            let ty = dy / (ds || 1);
            let mag_t = Math.hypot(tx, ty);
            Tx_all.push(tx / (mag_t || 1));
            Ty_all.push(ty / (mag_t || 1));

            // Outward Pointing Normals
            Nx_all.push(Ty_all[i]);
            Ny_all.push(-Tx_all[i]);

            // Dot Product Projections
            f_work_all.push(u * Tx_all[i] + v * Ty_all[i]);
            f_flux_all.push(u * Nx_all[i] + v * Ny_all[i]);
        }
        const s_max = arc_lengths[STEPS - 1];

        // Find Extents for Graphs
        const w_min = Math.min(...f_work_all), w_max = Math.max(...f_work_all);
        const fl_min = Math.min(...f_flux_all), fl_max = Math.max(...f_flux_all);

        // --- RENDER APP & CANVAS HANDLERS ---
        const mapCanvas = document.getElementById('mapCanvas');
        const workCanvas = document.getElementById('workCanvas');
        const fluxCanvas = document.getElementById('fluxCanvas');
        const ctx1 = mapCanvas.getContext('2d');
        const ctx2 = workCanvas.getContext('2d');
        const ctx3 = fluxCanvas.getContext('2d');

        let currentIdx = 0;
        let isPlaying = false;
        let isDragging = false;
        let stepSpeed = 2;

        function resizeCanvases() {
            const dpr = window.devicePixelRatio || 1;
            [mapCanvas, workCanvas, fluxCanvas].forEach(canvas => {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
            });
            drawAll();
        }
        window.addEventListener('resize', resizeCanvases);

        // --- INTERACTIVE DRAW CALL SEQUENCES ---
        function drawAll() {
            const dpr = window.devicePixelRatio || 1;
            drawMap(dpr);
            drawIntegrand(ctx2, workCanvas.width, workCanvas.height, dpr, arc_lengths, f_work_all, w_min, w_max, '#E74C3C', 'f_{flow}(s)', currentIdx);
            drawIntegrand(ctx3, fluxCanvas.width, fluxCanvas.height, dpr, arc_lengths, f_flux_all, fl_min, fl_max, '#3498DB', 'f_{flux}(s)', currentIdx);
            updateMathBox();
        }

        function drawMap(dpr) {
            ctx1.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
            ctx1.save();
            ctx1.scale(dpr, dpr);

            const w = mapCanvas.width / dpr;
            const h = mapCanvas.height / dpr;
            const scale = Math.min(w / 10, h / 8);
            const cx = w / 2;
            const cy = h / 2;

            // Helper for mapping coordinates
            const mapX = x => cx + x * scale;
            const mapY = y => cy - y * scale;

            // Draw Cartesian Grid Lines Frame
            ctx1.strokeStyle = '#2D2D2D';
            ctx1.lineWidth = 1;
            ctx1.setLineDash([4, 4]);
            for(let x = -4; x <= 4; x++) {
                if(x===0) continue;
                ctx1.beginPath(); ctx1.moveTo(mapX(x), 0); ctx1.lineTo(mapX(x), h); ctx1.stroke();
            }
            for(let y = -3; y <= 3; y++) {
                if(y===0) continue;
                ctx1.beginPath(); ctx1.moveTo(0, mapY(y)); ctx1.lineTo(w, mapY(y)); ctx1.stroke();
            }
            ctx1.setLineDash([]);

            // Intersecting Axes Lines
            ctx1.strokeStyle = '#555555';
            ctx1.beginPath(); ctx1.moveTo(mapX(-4.5), cy); ctx1.lineTo(mapX(4.5), cy); ctx1.stroke();
            ctx1.beginPath(); ctx1.moveTo(cx, mapY(-3.5)); ctx1.lineTo(cx, mapY(3.5)); ctx1.stroke();

            // Draw Muted Golden Background Vector Field Arrows Frame
            ctx1.strokeStyle = '#D4AF37';
            ctx1.fillStyle = '#D4AF37';
            ctx1.lineWidth = 0.8;
            for(let gx = -4; gx <= 4; gx += 0.5) {
                for(let gy = -3; gy <= 3; gy += 0.5) {
                    let u = -gy; let v = gx;
                    let mag = Math.hypot(u, v) || 1;
                    u = (u / mag) * 0.25; v = (v / mag) * 0.25;
                    
                    let x1 = mapX(gx), y1 = mapY(gy);
                    let x2 = mapX(gx + u), y2 = mapY(gy + v);
                    
                    ctx1.globalAlpha = 0.15;
                    ctx1.beginPath(); ctx1.moveTo(x1, y1); ctx1.lineTo(x2, y2); ctx1.stroke();
                    ctx1.globalAlpha = 1.0;
                }
            }

            // Draw Static Dimmed Guide Track
            ctx1.strokeStyle = 'rgba(255,255,255,0.15)';

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Integrals of Vector Fields</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #E0E0E0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #header {
            width: 100%;
            padding: 12px 0;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #2D2D2D;
            background-color: #121212;
            z-index: 10;
        }
        #container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: calc(100vh - 120px);
            max-width: 1200px;
            padding: 10px;
            box-sizing: border-box;
        }
        #top-panel {
            flex: 1.1;
            position: relative;
            background-color: #1E1E1E;
            border: 1px solid #333333;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        #bottom-panels {
            flex: 0.9;
            display: flex;
            gap: 15px;
        }
        .plot-panel {
            flex: 1;
            position: relative;
            background-color: #121212;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        #math-box {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(18, 18, 18, 0.85);
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
            pointer-events: none;
            width: 280px;
            font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace;
        }
        .box-title {
            font-weight: bold;
            color: #FFFFFF;
            margin-bottom: 4px;
            display: block;
        }
        .box-section {
            margin-bottom: 8px;
        }
        .box-section:last-child {
            margin-bottom: 0;
        }
        #control-panel {
            width: 100%;
            max-width: 1200px;
            background-color: #1E1E1E;
            border-top: 1px solid #2D2D2D;
            padding: 10px 20px;
            box-sizing: border-box;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input, select {
            background-color: #121212;
            color: #E0E0E0;
            border: 1px solid #444444;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, select:focus {
            border-color: #008080;
            outline: none;
        }
        #update-btn {
            background-color: #008080;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 12px;
            cursor: pointer;
            font-weight: bold;
        }
        #update-btn:hover {
            background-color: #006666;
        }
    </style>
    <!-- MathJax for nice mathematical rendering -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="header">Line Integrals of Vector Fields  |  Mode: Manual Drag  |  [Space] Play/Pause</div>
    
    <div id="container">
        <div id="top-panel">
            <canvas id="mapCanvas"></canvas>
            <div id="math-box">
                <div class="box-section">
                    <span class="box-title">Vector Field:</span>
                    F(x,y) = &lang;<span id="expr-u">M</span>, <span id="expr-v">N</span>&rang; = &lang;<span id="val-u">+0.00</span>, <span id="val-v">+0.00</span>&rang;
                </div>
                <div class="box-section">
                    <span class="box-title">Parametric Curve:</span>
                    r(t) = &lang;<span id="expr-x">x(t)</span>, <span id="expr-y">y(t)</span>&rang; = &lang;<span id="val-x">1.00</span>, <span id="val-y">0.00</span>&rang; at t = <span id="val-t">0.00</span>
                </div>
                <div class="box-section">
                    <span class="box-title">Arc Length Parameterization:</span>
                    R(s) = &lang;<span id="val-rx">1.00</span>, <span id="val-ry">0.00</span>&rang; at distance s = <span id="val-s">0.00</span>
                </div>
            </div>
        </div>
        <div id="bottom-panels">
            <div class="plot-panel">
                <canvas id="workCanvas"></canvas>
            </div>
            <div class="plot-panel">
                <canvas id="fluxCanvas"></canvas>
            </div>
        </div>
    </div>

    <!-- ADDED: Live User Input Control Panel -->
    <div id="control-panel">
        <div class="input-group">
            <label><strong>Field &vec;F(x,y):</strong></label>
            <select id="field-select">
                <option value="vortex">Vortex: &lang;-y, x&rang;</option>
                <option value="gravity">Gravity: &lang;0, -1&rang;</option>
                <option value="radial">Radial: &lang;x, y&rang;</option>
                <option value="saddle">Saddle: &lang;x, -y&rang;</option>
            </select>
        </div>
        <div class="input-group">
            <label><strong>Curve &vec;r(t):</strong></label>
            <select id="curve-select">
                <option value="ellipse">Ellipse: &lang;cos(t), 2sin(t)&rang;</option>
                <option value="circle">Circle: &lang;2cos(t), 2sin(t)&rang;</option>
                <option value="line">Vertical Line: &lang;1, t&rang; (t from 0 to &pi;)</option>
            </select>
        </div>
    </div>

    <script>
        // --- DATA STATE CONFIGURATION ---
        const STEPS = 1200;
        let t_values = [];
        let x_all = [];
        let y_all = [];
        let Tx_all = [];
        let Ty_all = [];
        let Nx_all = [];
        let Ny_all = [];
        let U_curve = [];
        let V_curve = [];
        let f_work_all = [];
        let f_flux_all = [];
        let arc_lengths = [];
        let work_poly_verts = [];
        let flux_polygons_verts = [];
        let s_max, w_min, w_max, fl_min, fl_max;

        // Custom Vector Fields Definition Library
        const fields = {
            vortex: (X, Y) => [-Y, X],
            gravity: (X, Y) => [0, -1],
            radial: (X, Y) => [X, Y],
            saddle: (X, Y) => [X, -Y]
        };

        // Custom Curve Trajectory Definition Library
        const curves = {
            ellipse: (t) => [Math.cos(t), 2 * Math.sin(t), 0, 2 * Math.PI],
            circle: (t) => [2 * Math.cos(t), 2 * Math.sin(t), 0, 2 * Math.PI],
            line: (t) => [1, (t / (2 * Math.PI)) * Math.PI, 0, 2 * Math.PI] // Re-maps interval to [0, pi]
        };

        function calculateSystem() {
            // Reset state arrays safely
            t_values = []; x_all = []; y_all = []; Tx_all = []; Ty_all = [];
            Nx_all = []; Ny_all = []; U_curve = []; V_curve = []; f_work_all = [];
            f_flux_all = []; arc_lengths =; work_poly_verts = []; flux_polygons_verts = [];

            const fieldKey = document.getElementById('field-select').value;
            const curveKey = document.getElementById('curve-select').value;
            
            const fieldFunc = fields[fieldKey];
            const curveFunc = curves[curveKey];

            // Update equations displayed inside Math box card overlay labels
            document.getElementById('expr-u').textContent = fieldKey === 'vortex' ? '-y' : (fieldKey === 'gravity' ? '0' : 'x');
            document.getElementById('expr-v').textContent = fieldKey === 'vortex' ? 'x' : (fieldKey === 'gravity' ? '-1' : (fieldKey === 'radial' ? 'y' : '-y'));
            document.getElementById('expr-x').textContent = curveKey === 'line' ? '1' : (curveKey === 'circle' ? '2cos(t)' : 'cos(t)');
            document.getElementById('expr-y').textContent = curveKey === 'line' ? 't' : '2sin(t)';

            // Generate Path Points
            for(let i = 0; i < STEPS; i++) {
                let norm_t = i / (STEPS - 1);
                let [, , start_t, end_t] = curveFunc(0);
                let t = start_t + norm_t * (end_t - start_t);
                let [x, y] = curveFunc(t);
                t_values.push(t);
                x_all.push(x);
                y_all.push(y);
            }

            // Calculate Arc Lengths, Tangents, Normals, and Dot Products
            let total_s = 0;
            for(let i = 0; i < STEPS; i++) {
                let next_idx = (i === STEPS - 1) ? i : i + 1;
                let prev_idx = (i === 0) ? i : i - 1;
                
                let dx = x_all[next_idx] - x_all[i];
                let dy = y_all[next_idx] - y_all[i];
                if (i === STEPS - 1) {
                    dx = x_all[i] - x_all[prev_idx];
                    dy = y_all[i] - y_all[prev_idx];
                }
                
                let ds = Math.hypot(dx, dy);
                if(i > 0) {
                    total_s += ds;
                    arc_lengths.push(total_s);
                }

                let [u, v] = fieldFunc(x_all[i], y_all[i]);
                U_curve.push(u);

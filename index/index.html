<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>calc-lab | Approximating π</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --border: #475569;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --teal: #2dd4bf;
      --orange: #fb923c;
      --slate: #64748b;
      --pink: #b74980;
      --blue: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header { text-align: center; margin-bottom: 12px; }
    header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 0.85rem; color: var(--muted); font-family: monospace; }

    .metrics-banner {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-family: monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 900px;
    }
    .metrics-banner span.teal { color: var(--teal); font-weight: 600; }
    .metrics-banner span.orange { color: var(--orange); font-weight: 600; }

    .canvas-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 16px;
    }
    .canvas-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .canvas-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
    .canvas-title.inscribed { color: var(--teal); }
    .canvas-title.circumscribed { color: var(--orange); }

    canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0f0f0f;
      border-radius: 4px;
    }

    .controls {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 20px;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-row { display: flex; align-items: center; gap: 12px; }
    .control-row label { font-size: 0.85rem; width: 130px; font-weight: 500; }
    .control-row input[type="range"] { flex: 1; accent-color: var(--pink); cursor: pointer; }
    .control-row input[type="range"].speed-slider { accent-color: var(--blue); }
    .val-display { font-family: monospace; font-size: 0.82rem; width: 60px; text-align: right; }

    .btn-row { display: flex; justify-content: center; gap: 10px; margin-top: 4px; }
    button {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 6px 16px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #334155; }
    button.primary { border-color: var(--pink); color: #f472b6; }

    @media (max-width: 768px) { .canvas-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Approximating π Using Regular Polygons</h1>
    <p>[ SPACE: Play/Pause &bull; UP/DOWN: Speed &bull; LEFT/RIGHT: Step n ]</p>
  </header>

  <div class="metrics-banner" id="metricsBanner"></div>

  <div class="canvas-container">
    <div class="canvas-card">
      <div class="canvas-title inscribed">Inscribed Polygon (Inner Bound)</div>
      <canvas id="canvasIn"></canvas>
    </div>
    <div class="canvas-card">
      <div class="canvas-title circumscribed">Circumscribed Polygon (Outer Bound)</div>
      <canvas id="canvasOut"></canvas>
    </div>
  </div>

  <div class="controls">
    <div class="control-row">
      <label>Sides (n):</label>
      <input type="range" id="nSlider" min="3" max="60" value="6" step="1" />
      <span class="val-display" id="nVal">n = 6</span>
    </div>
    <div class="control-row">
      <label>Frame Delay (ms):</label>
      <input type="range" id="speedSlider" class="speed-slider" min="20" max="400" value="120" step="10" />
      <span class="val-display" id="speedVal">120 ms</span>
    </div>
    <div class="btn-row">
      <button id="btnPlay" class="primary">Play</button>
      <button id="btnReset">Reset (n=6)</button>
    </div>
  </div>
  <script>
    // Exact port of your POLYGON_CACHE logic (n = 3 to 60)
    const CACHE = {};
    for (let n = 3; n <= 60; n++) {
      const vertsIn = [];
      for (let i = 0; i < n; i++) {
        const theta = (i * 2 * Math.PI) / n + Math.PI / n;
        vertsIn.push([Math.cos(theta), Math.sin(theta)]);
      }
      const sideIn = 2 * Math.sin(Math.PI / n);
      const perimIn = n * sideIn;
      const areaIn = 0.5 * n * Math.sin((2 * Math.PI) / n);

      const rOut = 1.0 / Math.cos(Math.PI / n);
      const vertsOut = [];
      for (let i = 0; i < n; i++) {
        const theta = (i * 2 * Math.PI) / n + Math.PI / n;
        vertsOut.push([rOut * Math.cos(theta), rOut * Math.sin(theta)]);
      }
      const sideOut = 2 * Math.tan(Math.PI / n);
      const perimOut = n * sideOut;
      const areaOut = n * Math.tan(Math.PI / n);

      const htmlStr = 
        `n = ${String(n).padStart(2)} sides   |   True Area: π = ${Math.PI.toFixed(5)}   |   True Perimeter = 2π = ${(2*Math.PI).toFixed(5)}<br>` +
        `<span class="teal">INSCRIBED:     Area = ${areaIn.toFixed(5)}    |    Perimeter = ${perimIn.toFixed(5)}</span><br>` +
        `<span class="orange">CIRCUMSCRIBED: Area = ${areaOut.toFixed(5)}   |    Perimeter = ${perimOut.toFixed(5)}</span>`;

      CACHE[n] = { vertsIn, vertsOut, rOut, htmlStr };
    }
    const canvasIn = document.getElementById("canvasIn");
    const canvasOut = document.getElementById("canvasOut");
    const ctxIn = canvasIn.getContext("2d");
    const ctxOut = canvasOut.getContext("2d");
    const nSlider = document.getElementById("nSlider");
    const speedSlider = document.getElementById("speedSlider");
    const nVal = document.getElementById("nVal");
    const speedVal = document.getElementById("speedVal");
    const metricsBanner = document.getElementById("metricsBanner");
    const btnPlay = document.getElementById("btnPlay");
    const btnReset = document.getElementById("btnReset");

    function resizeCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      return dpr;
    }

    function drawPolygon(ctx, dpr, size, verts, fillColor, strokeColor, limit) {
      ctx.save();
      ctx.clearRect(0, 0, size * dpr, size * dpr);
      ctx.scale(dpr, dpr);

      const center = size / 2;
      const scale = size / (2 * limit);

      function toPx(x, y) {
        return [center + x * scale, center - y * scale];
      }

      // Grid & Axes
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      let [axX1, axY1] = toPx(-limit, 0);
      let [axX2, axY2] = toPx(limit, 0);
      ctx.moveTo(axX1, axY1); ctx.lineTo(axX2, axY2);
      let [ayX1, ayY1] = toPx(0, -limit);
      let [ayX2, ayY2] = toPx(0, limit);
      ctx.moveTo(ayX1, ayY1); ctx.lineTo(ayX2, ayY2);
      ctx.stroke();

      // Static unit circle (R=1)
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      const [cx, cy] = toPx(0, 0);
      ctx.arc(cx, cy, 1.0 * scale, 0, 2 * Math.PI);
      ctx.stroke();

      // Polygon Fill & Edges
      if (verts.length > 0) {
        ctx.beginPath();
        verts.forEach((v, idx) => {
          const [px, py] = toPx(v[0], v[1]);
          if (idx === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.closePath();
        ctx.fillStyle = fillColor;
        ctx.fill();

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1.8;
        ctx.stroke();

        verts.forEach(v => {
          const [px, py] = toPx(v[0], v[1]);
          ctx.beginPath();
          ctx.arc(px, py, 2.5, 0, 2 * Math.PI);
          ctx.fillStyle = strokeColor;
          ctx.fill();
        });
      }
      ctx.restore();
    }
    let currentN = 6;
    let isPlaying = false;
    let direction = 1;
    let lastTime = 0;
    let intervalMs = parseInt(speedSlider.value, 10);

    function updateView(n) {
      currentN = n;
      nSlider.value = n;
      nVal.textContent = `n = ${n}`;

      const data = CACHE[n];
      metricsBanner.innerHTML = data.htmlStr;

      const size = canvasIn.getBoundingClientRect().width || 300;
      const dprIn = resizeCanvas(canvasIn);
      const dprOut = resizeCanvas(canvasOut);

      drawPolygon(ctxIn, dprIn, size, data.vertsIn, "rgba(45, 212, 191, 0.22)", "#2dd4bf", 1.3);
      
      const padOut = Math.max(1.4, data.rOut * 1.15);
      drawPolygon(ctxOut, dprOut, size, data.vertsOut, "rgba(251, 146, 60, 0.22)", "#fb923c", padOut);
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const elapsed = timestamp - lastTime;

      if (isPlaying && elapsed >= intervalMs) {
        lastTime = timestamp;
        let nextN = currentN + direction;
        if (nextN > 60) { nextN = 59; direction = -1; }
        else if (nextN < 3) { nextN = 4; direction = 1; }
        updateView(nextN);
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    nSlider.addEventListener("input", (e) => {
      isPlaying = false;
      btnPlay.textContent = "Play";
      updateView(parseInt(e.target.value, 10));
    });

    speedSlider.addEventListener("input", (e) => {
      intervalMs = parseInt(e.target.value, 10);
      speedVal.textContent = `${intervalMs} ms`;
    });

    btnPlay.addEventListener("click", () => {
      isPlaying = !isPlaying;
      btnPlay.textContent = isPlaying ? "Pause" : "Play";
      lastTime = 0;
    });

    btnReset.addEventListener("click", () => {
      isPlaying = false;
      direction = 1;
      btnPlay.textContent = "Play";
      updateView(6);
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        btnPlay.click();
      } else if (e.code === "ArrowRight") {
        isPlaying = false; btnPlay.textContent = "Play";
        updateView(Math.min(60, currentN + 1));
      } else if (e.code === "ArrowLeft") {
        isPlaying = false; btnPlay.textContent = "Play";
        updateView(Math.max(3, currentN - 1));
      } else if (e.code === "ArrowUp") {
        intervalMs = Math.max(20, intervalMs - 20);
        speedSlider.value = intervalMs;
        speedVal.textContent = `${intervalMs} ms`;
      } else if (e.code === "ArrowDown") {
        intervalMs = Math.min(400, intervalMs + 20);
        speedSlider.value = intervalMs;
        speedVal.textContent = `${intervalMs} ms`;
      }
    });

    window.addEventListener("resize", () => updateView(currentN));
    updateView(currentN);
  </script>
</body>
</html>
